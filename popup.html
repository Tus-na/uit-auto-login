<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 12px;
      font-family: Arial, sans-serif;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #004085;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <div class="field">
    <label for="username">MSSV:</label>
    <input type="text" id="username" placeholder="Nhập MSSV">
  </div>
  <div class="field">
    <label for="password">Mật khẩu:</label>
    <input type="password" id="password" placeholder="Nhập mật khẩu">
  </div>
  <button id="saveBtn">Lưu thông tin</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
